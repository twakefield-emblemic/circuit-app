# Render Blueprint — provisions the web service + Postgres together.
# To use: Render dashboard → New → Blueprint → connect this GitHub repo.
# Render reads this file and sets both services up in one pass; the only
# thing you'll be prompted to fill in by hand is ANTHROPIC_API_KEY (kept
# out of this file since it's a secret, not something to commit).
#
# Plans are set to "starter" (paid, ~$13/mo combined) rather than "free"
# on purpose: Render's free Postgres auto-deletes itself after 30 days
# (wiping all workspace data) and the free web service spins down after
# 15 minutes idle, adding a slow cold-start the next time someone opens
# a link — a bad look if that someone is a partner or a friend you just
# sent a link to. Change both "plan" lines to "free" below if you'd
# rather test at zero cost first and accept those tradeoffs.

databases:
  - name: circuit-db
    plan: starter
    postgresMajorVersion: 16

services:
  - type: web
    name: circuit-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: circuit-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_SHARED_SECRET
        generateValue: true
      - key: OWNER_WORKSPACE
        value: main
